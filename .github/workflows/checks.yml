name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apex_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_test -d apex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://apex_test:local_test_only@127.0.0.1:5432/apex_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:integration
