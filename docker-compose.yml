name: apex-local

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: apex_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_development"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgresql://apex:local_development_only@postgres:5432/apex_development
      DIRECT_URL: postgresql://apex:local_development_only@postgres:5432/apex_development
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the local environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the local environment}
      BACKGROUND_JOBS_ENABLED: "false"
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
